name: veille
image: mcp/veille
type: server
meta:
  category: security
  tags:
    - veille
    - email-validation
    - fraud-prevention
    - vat-validation
    - ip-reputation
about:
  title: Veille
  description: Validate emails, domains, IPs, VAT numbers and IBANs in milliseconds to block fake sign-ups, bots and fraud.
  icon: https://raw.githubusercontent.com/veilleio/veille-mcp/main/assets/icon-400.png
source:
  project: https://github.com/veilleio/veille-mcp
run:
  allowHosts:
    - api.veille.io:443
config:
  description: Configure your Veille API key.
  secrets:
    - name: veille.api_key
      env: VEILLE_API_KEY
      example: YOUR_API_KEY
      description: Required API key from https://app.veille.io.
      required: true
